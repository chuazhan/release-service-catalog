---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-sign-rpm-multiple-components
spec:
  description: Test creating internal requests to sign RPMs from multiple components in parallel
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "rpm-comp0",
                    "source": {
                      "git": {
                        "revision": "deadbeef"
                      }
                    },
                    "containerImage": "quay.io/test/rpm-component0@sha256:1111"
                  },
                  {
                    "name": "rpm-comp1",
                    "source": {
                      "git": {
                        "revision": "deadbeef"
                      }
                    },
                    "containerImage": "quay.io/test/rpm-component1@sha256:2222"
                  },
                  {
                    "name": "rpm-comp2",
                    "source": {
                      "git": {
                        "revision": "deadbeef"
                      }
                    },
                    "containerImage": "quay.io/test/rpm-component2@sha256:3333"
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "signOptions": {
                  "signKeytab": {
                    "principal": "test-principal@REDHAT.COM",
                    "name": "test-keytab",
                    "secret": "test-keytab-secret"
                  },
                  "signPipelineImage": "quay.io/redhat-isv/operator-pipelines-images:released",
                  "signKeyAlias": {
                    "key": "devkey1"
                  }
                },
                "sign": {
                  "request": "rpm-signing-pipeline"
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/release_plan_admission.json" << EOF
              {
                "spec": {
                  "pipeline": {
                    "pipelineRef": {
                      "resolver": "git",
                      "params": [
                        {
                          "name": "url",
                          "value": "https://localhost.git"
                        },
                        {
                          "name": "revision",
                          "value": "main"
                        },
                        {
                          "name": "pathInRepo",
                          "value": "pipelines/rpm-signing/rpm-signing.yaml"
                        }
                      ]
                    },
                    "serviceAccountName": "release-service-account"
                  }
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-sign-rpm
      params:
        - name: requester
          value: testuser-rpm-multi
        - name: requestTimeout
          value: "1800"
        - name: concurrentLimit
          value: "2"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot_spec.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: releasePlanAdmissionPath
          value: $(context.pipelineRun.uid)/release_plan_admission.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              internalRequests="$(kubectl get internalrequest -o json --sort-by=.metadata.creationTimestamp | jq -c)"
              irsLength=$(jq ".items | length" <<< "${internalRequests}" )

              echo "Found ${irsLength} internal requests"

              # We expect 3 internal requests (three components)
              if [ "${irsLength}" != "3" ]; then
                echo "Expected 3 internal requests, found ${irsLength}"
                exit 1
              fi

              expectedComponents=("rpm-comp0" "rpm-comp1" "rpm-comp2")
              expectedImages=("quay.io/test/rpm-component0@sha256:1111" "quay.io/test/rpm-component1@sha256:2222" "quay.io/test/rpm-component2@sha256:3333")
              foundComponents=()

              for((ir=0; ir<irsLength; ir++)); do
                params=$(jq -r ".items[$ir].spec.params" <<< "${internalRequests}")

                # Collect component names
                componentName=$(jq -r '.component_name' <<< "${params}")
                foundComponents+=("${componentName}")

                # Verify common fields
                requester=$(jq -r '.requester' <<< "${params}")
                if [ "${requester}" != "testuser-rpm-multi" ]; then
                  echo "requester does not match for component ${componentName}"
                  exit 1
                fi

                pipelineImage=$(jq -r '.pipeline_image' <<< "${params}")
                if [ "${pipelineImage}" != "quay.io/redhat-isv/operator-pipelines-images:released" ]; then
                  echo "pipeline_image does not match for component ${componentName}"
                  exit 1
                fi

                principal=$(jq -r '.principal' <<< "${params}")
                if [ "${principal}" != "test-principal@REDHAT.COM" ]; then
                  echo "principal does not match for component ${componentName}"
                  exit 1
                fi

                signKeyAlias=$(jq -r '.sign_key_alias' <<< "${params}")
                if [ "${signKeyAlias}" != "devkey1" ]; then
                  echo "sign_key_alias does not match for component ${componentName}: expected 'devkey1', got '${signKeyAlias}'"
                  exit 1
                fi

                echo "Verified IR ${ir} for component ${componentName}"
              done

              # Verify all expected components were found
              for expectedComp in "${expectedComponents[@]}"; do
                found=false
                for foundComp in "${foundComponents[@]}"; do
                  if [ "${expectedComp}" == "${foundComp}" ]; then
                    found=true
                    break
                  fi
                done
                if [ "${found}" == "false" ]; then
                  echo "Expected component ${expectedComp} not found in internal requests"
                  exit 1
                fi
              done

              echo "Test passed: All ${irsLength} internal requests created correctly"
      runAfter:
        - run-task
  finally:
    - name: cleanup
      taskSpec:
        steps:
          - name: delete-crs
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              kubectl delete internalrequests --all
